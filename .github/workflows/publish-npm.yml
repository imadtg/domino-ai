name: Publish npm package
run-name: Publish domino-ai@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in package.json
        required: true
        type: string
      bootstrap:
        description: Use NPM_TOKEN for the first-ever publish only
        required: true
        default: false
        type: boolean

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production

    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1

      - name: Validate release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must run from the main branch, not $GITHUB_REF."
            exit 1
          fi

          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"

          if [[ "$package_name" != "domino-ai" ]]; then
            echo "::error::Expected package name domino-ai, found $package_name."
            exit 1
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json must contain a stable semantic version (for example, 0.1.0)."
            exit 1
          fi

          if [[ "$package_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Entered version $EXPECTED_VERSION does not match package.json version $package_version."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v$package_version"; then
            echo "::error::Git tag v$package_version already exists."
            exit 1
          fi

          set +e
          lookup="$(npm view "$package_name@$package_version" version 2>&1)"
          lookup_status=$?
          set -e

          if [[ $lookup_status -eq 0 ]]; then
            echo "::error::$package_name@$package_version is already published."
            exit 1
          fi

          if [[ "$lookup" != *"E404"* ]]; then
            echo "$lookup"
            echo "::error::Could not safely determine whether this version is already published."
            exit 1
          fi

          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: |
          bun run clean
          bun run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$BOOTSTRAP" == "true" ]]; then
            if [[ -z "$BOOTSTRAP_TOKEN" ]]; then
              echo "::error::The npm-production environment needs an NPM_TOKEN secret for the first publish."
              exit 1
            fi

            npm config set //registry.npmjs.org/:_authToken "$BOOTSTRAP_TOKEN" --location=user
          fi

          npm publish --access public --provenance

      - name: Tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --field "ref=refs/tags/v$PACKAGE_VERSION" \
            --field "sha=$GITHUB_SHA"
